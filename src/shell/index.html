<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' prism:; img-src prism: https: http: data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="./shell.css">
<script src="prism://settings/shared/theme-engine.js"></script>
<title>Prism Browser</title>
</head>
<body>
  <div id="chrome">
    <!-- Everything the page view must be positioned below. The main process
         cannot read this stylesheet, so shell.js measures #chrome-top and
         reports the height over IPC; --chrome-h mirrors it for CSS overlays. -->
    <div id="chrome-top">
      <!-- Tab strip -->
      <div id="tabstrip">
        <!-- Private windows only. shell.js shows/hides this from state.private
             (the `private` flag on the snapshot) and body.private recolours the
             chrome, so an incognito window is unmistakable at a glance. -->
        <div id="priv-badge" style="display:none" title="Private browsing. Cookies, history and site data from this window are not saved to your device and disappear when the window closes.">
          <svg viewBox="0 0 16 16" width="12" height="12"><path d="M2.5 7.5h11M5 7.5L3.6 4.2a1 1 0 0 1 .9-1.4h7a1 1 0 0 1 .9 1.4L11 7.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M4 10.5h3m2 0h3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
          <span>Incognito</span>
        </div>
        <div id="tabs" role="tablist"></div>
        <button id="tab-new" class="ibtn" title="New tab (Ctrl+T)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div id="drag-space"></div>
        <div id="win-controls">
          <button id="win-min" class="wcbtn" title="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
          <button id="win-max" class="wcbtn" title="Maximize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
          <button id="win-close" class="wcbtn wcbtn-close" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
        </div>
      </div>

      <!-- Toolbar -->
      <div id="toolbar">
        <button id="nav-back" class="ibtn" title="Back (Alt+Left)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="nav-forward" class="ibtn" title="Forward (Alt+Right)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="nav-reload" class="ibtn" title="Reload (Ctrl+R)">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="nav-home" class="ibtn" title="Home">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2.6 7.1L8 2.6l5.4 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4.1 7.4V13h7.8V7.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>

        <div id="omnibox">
          <span id="sec-icon" title="Connection status">
            <svg id="ic-lock" viewBox="0 0 16 16" width="13" height="13"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
            <svg id="ic-info" viewBox="0 0 16 16" width="13" height="13" style="display:none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 7v4M8 4.8v.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
            <svg id="ic-prism" viewBox="0 0 16 16" width="13" height="13" style="display:none"><path d="M8 2.2c3.4 0 6 2.1 6 4.6 0 .9-.7 1.4-1.6 1.4H3.6c-.9 0-1.6-.5-1.6-1.4 0-2.5 2.6-4.6 6-4.6z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5.6 8.4v3a2 2 0 1 0 4 0" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </span>
          <input id="omni-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Search Prism or enter an address" />
          <button id="star" class="ibtn ibtn-ghost" title="Bookmark this page (Ctrl+D)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path id="star-path" d="M8 2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.2 4.4 13l.7-4L2.2 6.3l4-.6z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <button id="shield" class="ibtn" title="Prism Shield">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.8l5 1.8v3.6c0 3.3-2.1 5.9-5 7-2.9-1.1-5-3.7-5-7V3.6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M5.8 8l1.6 1.6 2.8-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span id="shield-count" class="badge" style="display:none">0</span>
        </button>

        <button id="ext-btn" class="ibtn" title="Extensions">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.6a1.5 1.5 0 0 1 1.5 1.5v.7a1.9 1.9 0 1 1-3 0v-.7A1.5 1.5 0 0 1 8 1.6zM14.4 8a1.5 1.5 0 0 1-1.5 1.5h-.7a1.9 1.9 0 1 1 0-3h.7A1.5 1.5 0 0 1 14.4 8zM8 14.4a1.5 1.5 0 0 1-1.5-1.5v-.7a1.9 1.9 0 1 1 3 0v.7a1.5 1.5 0 0 1-1.5 1.5zM1.6 8a1.5 1.5 0 0 1 1.5-1.5h.7a1.9 1.9 0 1 1 0 3h-.7A1.5 1.5 0 0 1 1.6 8z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
          <span id="ext-count" class="badge" style="display:none">0</span>
        </button>

        <button id="theme-btn" class="ibtn" title="Change browser theme" aria-label="Change browser theme">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.5a6.5 6.5 0 1 0 0 13h.7a1.8 1.8 0 0 0 1.2-3.1 1.1 1.1 0 0 1 .8-1.9h1.1A2.7 2.7 0 0 0 14.5 7C14.5 3.9 11.6 1.5 8 1.5z" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="4.8" cy="7" r=".8" fill="currentColor"/><circle cx="7.8" cy="4.8" r=".8" fill="currentColor"/><circle cx="10.8" cy="6" r=".8" fill="currentColor"/></svg>
        </button>

        <button id="menu-btn" class="ibtn" title="Menu">
          <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="3.2" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="12.8" r="1.4" fill="currentColor"/></svg>
        </button>

        <button id="update-btn" class="ibtn" style="display:none" title="Update available">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2.5v7M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span id="update-dot" class="update-dot"></span>
        </button>
      </div>

      <!-- Bookmarks bar: in normal flow, so it pushes the page down rather
           than overlaying the top of the page content. -->
      <div id="bookmarksbar" style="display:none"></div>
    </div>

    <!-- Omnibox dropdown -->
    <div id="omni-dropdown" style="display:none"></div>

    <!-- Shield popup -->
    <div id="shield-pop" style="display:none">
      <div class="pop-row">
        <span class="pop-title">Prism Shield</span>
        <label class="switch"><input type="checkbox" id="shield-global"><span class="slider"></span></label>
      </div>
      <div class="pop-note" id="shield-note"></div>
      <div class="pop-row" id="shield-site-row" style="display:none">
        <span id="shield-site-label"></span>
        <label class="switch"><input type="checkbox" id="shield-site"><span class="slider"></span></label>
      </div>
      <button class="pop-link" id="open-privacy">Privacy dashboard</button>
    </div>

    <!-- Quick appearance picker -->
    <div id="theme-pop" style="display:none">
      <div class="pop-row"><span class="pop-title">Appearance</span></div>
      <div class="theme-mode" role="group" aria-label="Base browser theme">
        <button data-base-theme="dark">Dark</button><button data-base-theme="light">Light</button><button data-base-theme="system">System</button>
      </div>
      <label class="theme-label" for="shell-hue">Accent hue</label>
      <input id="shell-hue" type="range" min="0" max="359" aria-label="Browser theme hue">
      <label class="theme-label" for="shell-gradient">Gradient</label>
      <select id="shell-gradient">
        <option value="aurora">Aurora</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option>
        <option value="candy">Candy</option><option value="ember">Ember</option><option value="forest">Forest</option><option value="none">Solid</option>
      </select>
      <label class="theme-label" for="shell-motion">Motion</label>
      <select id="shell-motion">
        <option value="none">Still</option><option value="shimmer">Shimmer</option><option value="drift">Drift</option>
        <option value="breathe">Breathe</option><option value="pulse">Pulse</option><option value="wave">Wave</option>
      </select>
      <button class="pop-link" id="theme-random">Surprise me</button>
      <button class="pop-link" id="theme-accessibility">Accessibility settings</button>
    </div>

    <!-- Main menu -->
    <div id="menu-panel" style="display:none">
      <button class="mi" data-act="new-tab"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>New tab</button>
      <button class="mi" data-act="private"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M2.5 7.5h11M5 7.5L3.6 4.2a1 1 0 0 1 .9-1.4h7a1 1 0 0 1 .9 1.4L11 7.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M4 10.5h3m2 0h3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>New private window</button>
      <div class="msep"></div>
      <button class="mi" data-act="history"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>History</button>
      <button class="mi" data-act="bookmarks"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M4 2.5h8V14l-4-2.6L4 14z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>Bookmarks</button>
      <button class="mi" data-act="downloads"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2.5v7M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Downloads</button>
      <button class="mi" data-act="passwords"><svg viewBox="0 0 16 16" width="15" height="15"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="8" cy="10.2" r="1" fill="currentColor"/></svg>Passwords</button>
      <button class="mi" data-act="extensions"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M6.5 2.5h3v2a1.5 1.5 0 1 0 0 2v2h2a1.5 1.5 0 1 1-2 0h-2v-2h-2a1.5 1.5 0 1 0 0-3z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round" transform="translate(1.5 1.5)"/></svg>Extensions</button>
      <button class="mi" data-act="settings"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>Settings</button>
      <button class="mi" data-act="privacy"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.8l5 1.8v3.6c0 3.3-2.1 5.9-5 7-2.9-1.1-5-3.7-5-7V3.6z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>Privacy dashboard</button>
      <div class="msep"></div>
      <button class="mi" data-act="search-home"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>Prism Search</button>
      <button class="mi" data-act="update-lists"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Update protection lists</button>
      <button class="mi" data-act="check-update"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2.5v7M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Check for updates</button>
      <button class="mi" data-act="about"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 7.2v3.6M8 4.8v.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>About Prism Browser</button>
      <div class="msep"></div>
      <button class="mi" data-act="bookmarks-bar" id="mi-bookmarksbar">Show bookmarks bar</button>
    </div>

    <!-- Extensions dropdown (the toolbar "puzzle piece"). Lists installed extensions
     and opens each one's management page; options page popups are a known
     Electron gap, so a popup-only extension may not render here. -->
    <div id="ext-pop" style="display:none">
      <div class="pop-row" style="padding-bottom:6px">
        <span class="pop-title">Extensions</span>
      </div>
      <div id="ext-list"></div>
      <div class="msep"></div>
      <button class="pop-link" id="ext-store-chrome">Browse Chrome Web Store</button>
      <button class="pop-link" id="ext-store-edge">Browse Edge Add-ons</button>
      <button class="pop-link" id="ext-manage">Manage extensions</button>
    </div>

    <!-- Find bar -->
    <div id="findbar" style="display:none">
      <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      <input id="find-input" type="text" placeholder="Find in page" spellcheck="false"/>
      <span id="find-count"></span>
      <button id="find-prev" class="ibtn ibtn-small" title="Previous">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="find-next" class="ibtn ibtn-small" title="Next">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button id="find-close" class="ibtn ibtn-small" title="Close">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <!-- status bubble + toasts -->
    <div id="status-bubble" style="display:none"></div>
    <div id="toasts"></div>

    <div id="load-progress" style="display:none"></div>
  </div>
  <script src="./shell.js"></script>
</body>
</html>
