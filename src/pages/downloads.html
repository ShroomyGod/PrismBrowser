<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon-32.png">
<link rel="stylesheet" href="/common.css">
<title>Downloads - Prism</title>
<style>
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .where { font-size: 12.5px; color: var(--dim); word-break: break-all; }
  .where b { color: var(--text); font-weight: 600; }
  .av { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .note { margin-top: 8px; font-size: 12px; color: var(--danger); }
  .scan-ok { color: var(--ok); }
  .scan-none { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="/newtab">New Tab</a>
    <a href="/history">History</a>
    <a href="/bookmarks">Bookmarks</a>
    <a href="/downloads" class="on">Downloads</a>
    <a href="/settings">Settings</a>
    <a href="/privacy">Privacy</a>
  </div>
  <div class="page-head">
    <img class="wordmark" src="/assets/wordmark@2x.png" alt="Prism">
    <h1>Downloads</h1>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="where" id="where">Saving to…</div>
      <div class="row">
        <button id="choose-folder" class="small">Change folder</button>
        <button id="clear" class="small">Clear list</button>
      </div>
    </div>
    <div class="av" id="av"></div>
  </div>

  <div class="card" style="padding:6px 10px; margin-top:14px">
    <table class="list"><tbody id="rows"></tbody></table>
  </div>
  <div class="empty" id="empty" style="display:none">No downloads yet.</div>
  <div class="note" id="note" style="display:none"></div>
</div>
<script src="/common.js"></script>
<script>
(async function () {
  await PrismUI.boot();

  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const note = document.getElementById('note');

  function showNote(message) {
    note.textContent = message || '';
    note.style.display = message ? '' : 'none';
  }

  function stateBadge(item) {
    const b = document.createElement('span');
    const raw = String(item.state || item.status || 'completed').toLowerCase();
    if (raw === 'scanning') { b.className = 'badge'; b.textContent = 'scanning…'; return b; }
    if (raw === 'progressing') { b.className = 'badge'; b.textContent = 'downloading…'; return b; }
    if (raw.includes('progress') || raw.includes('active')) b.className = 'badge';
    // quarantined/blocked MUST NOT fall through to green. security.js moves a
    // detected file into quarantine and sets state 'quarantined', which used to
    // match none of these branches and rendered as a reassuring green badge.
    else if (raw.includes('quarantin') || raw.includes('blocked') ||
             raw.includes('interrupt') || raw.includes('fail') || raw.includes('cancel')) b.className = 'badge red';
    else if (raw === 'deleted') { b.className = 'badge red'; b.textContent = 'file deleted'; return b; }
    else b.className = 'badge green';
    b.textContent = raw;
    return b;
  }

  function sizeLabel(item) {
    const total = item.totalBytes != null ? item.totalBytes : item.size;
    if (!total) return '';
    const got = item.receivedBytes != null ? item.receivedBytes : item.bytes;
    if (got != null && got < total) {
      return PrismUI.fmtBytes(got) + ' of ' + PrismUI.fmtBytes(total);
    }
    return PrismUI.fmtBytes(total);
  }

  // Report a failed action where the user can see it. The handlers refuse
  // paths that are not recorded downloads, so this is how a stale row explains
  // itself instead of appearing to do nothing.
  async function act(fn) {
    showNote('');
    try {
      const result = await fn();
      if (result && result.ok === false && result.error) showNote(result.error);
      return result;
    } catch (e) {
      showNote('Could not complete that action: ' + ((e && e.message) || e));
      return null;
    }
  }

  function button(label, title, handler) {
    const b = document.createElement('button');
    b.className = 'small';
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', handler);
    return b;
  }

  function buildActions(item, hasFile) {
    const wrap = document.createElement('div');
    wrap.className = 'row-actions';

    // Executables get a distinct Run action: opening one IS running it, and
    // labelling that "Open" hides what is about to happen.
    const runnable = /\.(exe|bat|cmd|com|ps1|msi|scr)$/i.test(item.filename || '');
    if (hasFile && runnable) {
      wrap.append(button('Run', 'Run this file', () => act(() => window.prism.downloadsRun(item.path))));
    }
    if (hasFile) {
      wrap.append(button('Open', 'Open with the default app', () => act(() => window.prism.downloadsOpen(item.path, false))));
      wrap.append(button('Show in folder', 'Reveal this file in File Explorer', () => act(() => window.prism.downloadsReveal(item.path))));
      wrap.append(button('Delete file', 'Delete this file from disk', async () => {
        if (!confirm('Delete "' + (item.filename || 'this file') + '" from disk?\n\nThis cannot be undone.')) return;
        const r = await act(() => window.prism.downloadsDeleteFile(item.path));
        if (r && r.ok) load();
      }));
    } else if (item.state === 'deleted') {
      const gone = document.createElement('span');
      gone.className = 'muted';
      gone.textContent = 'File removed';
      wrap.append(gone);
    }
    return wrap;
  }

  async function load() {
    let list = [];
    try { list = (await window.prism.downloadsList()) || []; }
    catch (_) { list = []; }
    rows.textContent = '';
    empty.style.display = list.length ? 'none' : '';
    for (const item of list) {
      const tr = document.createElement('tr');

      const cell = document.createElement('td');
      const name = document.createElement('div');
      name.textContent = item.filename || item.name || item.url || 'download';
      const sub = document.createElement('div');
      sub.className = 'muted';
      const bits = [sizeLabel(item), PrismUI.fmtTime(item.ts || item.startedAt)].filter(Boolean);
      if (item.path) bits.push(item.path);
      sub.textContent = bits.join('  ');
      cell.append(name, sub);
      tr.append(cell);

      const flag = document.createElement('td');
      if (item.threat) {
        const box = document.createElement('div');
        const t = document.createElement('span');
        t.className = 'badge red';
        t.textContent = String(item.state || '').toLowerCase().includes('quarantin') ? 'quarantined' : 'blocked';
        // Surface WHY it was flagged - the detector's verdict is the only
        // thing that tells the user whether this was a false positive.
        const why = document.createElement('div');
        why.className = 'muted';
        why.style.marginTop = '3px';
        why.textContent = item.threat;
        box.append(t, why);
        flag.append(box);
      } else {
        const b = stateBadge(item);
        flag.append(b);
        // Say which engine actually looked, and be explicit when nothing did,
        // so "no badge" is never read as "verified safe".
        if (item.scannedBy) {
          const by = document.createElement('div');
          by.className = 'muted scan-ok';
          by.style.marginTop = '3px';
          by.textContent = 'Scanned by ' + item.scannedBy;
          flag.append(by);
        } else if (String(item.state).toLowerCase() === 'completed') {
          const by = document.createElement('div');
          by.className = 'muted scan-none';
          by.style.marginTop = '3px';
          by.textContent = 'Not scanned';
          flag.append(by);
        }
      }
      tr.append(flag);

      // A row is actionable only when the file is still on disk.
      const hasFile = !!item.path && String(item.state) !== 'deleted';
      tr.append(buildActions(item, hasFile));

      rows.append(tr);
    }
  }

  async function loadWhere() {
    const info = await window.prism.downloadsAntivirus();
    const where = document.getElementById('where');
    where.textContent = '';
    const label = document.createElement('span');
    label.textContent = 'Saving to ';
    const dir = document.createElement('b');
    dir.textContent = info.prompt ? '(asking where to save each file)' : info.dir;
    where.append(label, dir);

    const av = document.getElementById('av');
    av.textContent = '';
    const dot = document.createElement('span');
    const text = document.createElement('span');
    if (info.available) {
      dot.className = 'badge green';
      dot.textContent = 'protected';
      text.textContent = 'Finished downloads are scanned locally by ' + info.engine +
        '. Nothing is uploaded.';
    } else {
      dot.className = 'badge red';
      dot.textContent = 'no antivirus';
      text.textContent = 'Windows Defender was not found, so only hash reputation checking is applied to downloads.';
    }
    av.append(dot, text);
  }

  document.getElementById('choose-folder').addEventListener('click', async () => {
    const r = await act(() => window.prism.downloadsChooseFolder());
    if (r && r.ok) await loadWhere();
  });

  document.getElementById('clear').addEventListener('click', async () => {
    if (!confirm('Clear the download list?\n\nFiles already on disk are left alone.')) return;
    await window.prism.downloadsClear();
    load();
  });

  document.getElementById('empty').textContent = 'No downloads yet.';
  window.prism.onDownloadsChanged(load);
  await loadWhere();
  load();
})();
</script>
</body>
</html>
