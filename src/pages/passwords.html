<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon-32.png">
<link rel="stylesheet" href="/common.css">
<title>Passwords - Prism</title>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="/newtab">New Tab</a>
    <a href="/history">History</a>
    <a href="/bookmarks">Bookmarks</a>
    <a href="/downloads">Downloads</a>
    <a href="/passwords" class="on">Passwords</a>
    <a href="/settings">Settings</a>
  </div>
  <div class="page-head">
    <img class="logo-mini" src="/assets/icon-64.png" alt="">
    <h1>Passwords</h1>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Add a password</h2>
    <div class="row" style="flex-wrap:wrap">
      <input id="origin" type="text" placeholder="https://example.com" style="flex:2;min-width:220px">
      <input id="user" type="text" placeholder="Username" style="flex:1;min-width:140px">
      <input id="pass" type="password" placeholder="Password" style="flex:1;min-width:140px">
      <button id="add" class="primary">Add</button>
    </div>
    <div class="muted" style="margin-top:10px">
      Stored encrypted at rest with AES-256-GCM and never leave this device.
    </div>
  </div>
  <div class="card" style="padding:6px 10px">
    <table class="list"><tbody id="rows"></tbody></table>
  </div>
  <div class="empty" id="empty" style="display:none">No saved passwords.</div>
</div>
<script src="/common.js"></script>
<script>
(async function () {
  await PrismUI.boot();
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');

  async function load() {
    let list = [];
    try { list = (await window.prism.passwordsList()) || []; }
    catch (_) { list = []; }
    rows.textContent = '';
    empty.style.display = list.length ? 'none' : '';
    for (const item of list) {
      const tr = document.createElement('tr');

      const cell = document.createElement('td');
      const site = document.createElement('div');
      site.textContent = item.origin || item.url || '';
      const user = document.createElement('div');
      user.className = 'muted';
      user.textContent = item.username || '';
      cell.append(site, user);
      tr.append(cell);

      const secret = document.createElement('td');
      secret.className = 'muted';
      secret.textContent = '\u2022'.repeat(8);
      tr.append(secret);

      const act = document.createElement('td');
      act.style.textAlign = 'right';
      act.style.whiteSpace = 'nowrap';
      const show = document.createElement('button');
      show.className = 'small';
      show.textContent = 'Reveal';
      show.addEventListener('click', async () => {
        try {
          const out = await window.prism.passwordsReveal(item.id);
          secret.textContent = (out && (out.password || out)) || '(unavailable)';
        } catch (e) {
          secret.textContent = 'Could not decrypt';
        }
      });
      const del = document.createElement('button');
      del.className = 'small';
      del.textContent = 'Remove';
      del.addEventListener('click', async () => {
        try { await window.prism.passwordsRemove(item.id); } catch (_) {}
        load();
      });
      act.append(show, del);
      tr.append(act);

      rows.append(tr);
    }
  }

  document.getElementById('add').addEventListener('click', async () => {
    const origin = document.getElementById('origin').value.trim();
    const username = document.getElementById('user').value.trim();
    const password = document.getElementById('pass').value;
    if (!origin || !password) return;
    const ok = await window.prism.passwordsAdd(origin, username, password);
    if (ok) {
      document.getElementById('pass').value = '';
      load();
    }
  });

  load();
})();
</script>
</body>
</html>
