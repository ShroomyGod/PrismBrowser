<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon-32.png">
<link rel="stylesheet" href="/common.css">
<title>New Tab</title>
<style>
  body { background: var(--bg); }
  .hero { display: flex; flex-direction: column; align-items: center; padding-top: 10vh; }
  .hero img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 16px; }
  .brand { font-size: 22px; font-weight: 600; letter-spacing: -.2px; margin-bottom: 6px; color: var(--text); }
  .brand span { color: var(--text-dim); font-weight: 400; }
  .tagline { color: var(--dim); margin-bottom: 26px; font-size: 13px; max-width: 520px; text-align: center; line-height: 1.5; }
  .searchbox {
    display: flex; align-items: center; width: min(560px, 90%); gap: 10px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 26px;
    padding: 13px 20px; transition: border-color .15s;
  }
  .searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .searchbox svg { color: var(--dim); flex: none; }
  .searchbox input { flex: 1; background: none; border: none; color: var(--text); font-size: 16px; user-select: text; }
  .searchbox input:focus { outline: none; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 38px; width: min(680px, 95%); }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px;
    padding: 14px 8px; border-radius: 12px; cursor: pointer; background: var(--bg2);
    border: 1px solid var(--line);
  }
  .tile:hover { border-color: var(--accent); }
  .tile img, .tile .f { width: 28px; height: 28px; border-radius: 7px; }
  .tile span { font-size: 11px; color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .idxline { margin-top: 30px; color: var(--dim); font-size: 12px; display: flex; gap: 16px; align-items: center; }
  .idxline b { color: var(--text); }
  .quick { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .quick button { font-size: 12px; padding: 6px 12px; border-radius: 14px; background: var(--bg2); }
</style>
</head>
<body>
<div class="hero">
  <img src="/assets/icon-128.png" alt="Prism">
  <div class="brand">Prism <span>Browser</span></div>
  <div class="tagline">A privacy-focused desktop browser.</div>
  <form class="searchbox" id="form">
    <svg viewBox="0 0 16 16" width="17" height="17"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    <input id="q" type="text" placeholder="Search the web, or type a URL" autofocus>
  </form>
  
</div>
<script src="/common.js"></script>
<script src="/newtab.js"></script>
</body>
</html>
